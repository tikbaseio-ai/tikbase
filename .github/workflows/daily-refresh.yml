name: Daily TikBase Refresh

on:
  schedule:
    - cron: "0 6 * * *" # 6:00 AM UTC daily
  workflow_dispatch: # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Phase 3 now snapshots ~6,000 products/run (hot + rotation) instead of 3,000.
    # At the measured ~3.49 products/sec that is ~29 min of Phase 3 versus ~14,
    # and observed end-to-end runs already ranged 137-165 min against the old
    # 180-minute cap. Raised to leave real headroom — GitHub only bills the
    # minutes actually used, so a higher ceiling costs nothing on a normal run.
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # Phase 3 snapshot budget, stated explicitly so the daily ScrapeCreators
      # spend is visible here rather than buried in a default.
      #
      # The hot tier is NOT bounded by SNAPSHOT_HOT_LIMIT alone: it is every
      # product currently served from rankings_cache (~10.7k) UNION the top
      # SNAPSHOT_HOT_LIMIT by sold_count, so ~11.0k. Plus ROTATION, which drains
      # the least-recently-snapshotted tail so every product is covered on a
      # ~5.5-day cycle (needed for the 7-day window's delta — see MAX_SPAN_RATIO
      # in api/top-products.ts).
      #
      # TOTAL ~15,500 calls/day, up from 3,000 before this change. Credits ran
      # out entirely on 2026-07-19/20; watch the balance after this ships.
      # To cut spend: lower SNAPSHOT_ROTATION_LIMIT first (keeps the membership
      # guarantee), then STORE_TOP_N_PRODUCTS in precompute-rankings.ts (shrinks
      # the cache, and so the guarantee, at source). SNAPSHOT_CACHE_MEMBERSHIP=0
      # disables the guarantee outright — emergency lever only.
      - name: Run daily refresh pipeline
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SNAPSHOT_HOT_LIMIT: "1500"
          SNAPSHOT_ROTATION_LIMIT: "4500"
        run: node pipeline/tikbase-daily-refresh.js

      # Deepen video coverage for under-covered ranked products. Capped at 150/day
      # to fit the job budget; it progressively clears the backlog since covered
      # products are skipped on subsequent runs.
      - name: Discover videos for top products
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCOVER_LIMIT: "150"
        run: node pipeline/discover-videos.js

      # Precompute Top Products/Videos rankings into rankings_cache so the API
      # serves instant reads. Runs LAST, over the freshly-collected data. Reads
      # only from Supabase — no ScrapeCreators credits needed.
      - name: Precompute rankings cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx pipeline/precompute-rankings.ts
