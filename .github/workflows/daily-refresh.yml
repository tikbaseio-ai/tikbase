name: Daily TikBase Refresh

on:
  schedule:
    - cron: "0 6 * * *" # 6:00 AM UTC daily
  workflow_dispatch:
    inputs:
      daily_call_budget:
        description: "Cap this run's ScrapeCreators calls. Snapshots shrink to fit. Blank keeps 1,500 hot + 4,500 rotation."
        required: false
        default: ""
      snapshot_hot_limit:
        description: "Pin hot snapshots. Blank uses the default, or the budget split."
        required: false
        default: ""
      snapshot_rotation_limit:
        description: "Pin rotation snapshots. Blank uses the default, or the budget split."
        required: false
        default: ""
      discover_limit:
        description: "Products to run video discovery for. The refresh step counts this toward the credit preflight."
        required: false
        default: "150"

jobs:
  # SPLIT INTO TWO JOBS, and the reason is arithmetic rather than taste.
  #
  # The 2026-08-15 scheduled run was CANCELLED at exactly 240.3 minutes, mid-way
  # through "Precompute creator leaderboard" — it hit this timeout. Step timings
  # from the last run that finished (2026-08-14, 206.6 min total):
  #
  #   pipeline, phases 1-5        52.7 min
  #   discover videos             32.4 min
  #   precompute rankings        104.3 min
  #   precompute creators         16.8 min
  #
  # 85 minutes of ingestion and 121 of precompute, sharing one 240-minute
  # budget: 33 minutes of headroom, 16%. A catch-up night — more rotation
  # backlog, more products to snapshot — spends that and the precompute is
  # killed after the credits have already been paid for.
  #
  # Two jobs give each side its own 240: ingestion has 2.8x headroom, precompute
  # 2.0x. Nothing is passed between them but the database, so `needs` is the
  # whole handoff. GitHub bills minutes used, so this costs the same.
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Blank means "not set", which the pipeline reads as the historical
    # default. A repository variable of the same name changes the scheduled
    # run without a commit; a dispatch input wins over the variable.
    env:
      DAILY_CALL_BUDGET: ${{ github.event.inputs.daily_call_budget || vars.DAILY_CALL_BUDGET || '' }}
      SNAPSHOT_HOT_LIMIT: ${{ github.event.inputs.snapshot_hot_limit || vars.SNAPSHOT_HOT_LIMIT || '' }}
      SNAPSHOT_ROTATION_LIMIT: ${{ github.event.inputs.snapshot_rotation_limit || vars.SNAPSHOT_ROTATION_LIMIT || '' }}
      DISCOVER_LIMIT: ${{ github.event.inputs.discover_limit || vars.DISCOVER_LIMIT || '150' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          # v5 turns caching on when package.json has a packageManager field.
          # This repo does not, and npm ci is the install we want either way.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Phase 3 snapshot budget. The historical default is 1,500 hot + 4,500
      # rotation (6,000 snapshot calls, plus phases 1/2/4 and video discovery).
      # HOT re-snapshots the top sellers every run; ROTATION drains the
      # least-recently-snapshotted tail so every product is covered on a
      # ~7.5-day cycle — inside the 4.7-10.5 day span band that
      # MAX_SPAN_RATIO=1.5 allows for the tightest (7d) window.
      #
      # Cut the day without a commit by setting the repository variable
      # DAILY_CALL_BUDGET (for example 3000) or passing daily_call_budget on a
      # manual run. Snapshots shrink to fit; the hot:rotation ratio stays.
      # The script probes the credit balance first and exits before any data
      # call if the key is bad or the balance is short.
      #
      # Credits ran out entirely on 2026-07-19/20; the run exits non-zero on
      # any 402, so a repeat shows red instead of green.
      - name: Run daily refresh pipeline
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node pipeline/tikbase-daily-refresh.js

      # Deepen video coverage for under-covered ranked products. DISCOVER_LIMIT
      # (job env, default 150) is the product cap; each product costs up to 3
      # searches, and the refresh step's preflight already counted them.
      # Covered products are skipped, so the backlog clears across nights.
      - name: Discover videos for top products
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node pipeline/discover-videos.js

  # Precompute runs only if ingestion succeeded — ranking yesterday's data over
  # a half-written snapshot set would be worse than ranking it late.
  precompute:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Precompute Top Products/Videos rankings into rankings_cache so the API
      # serves instant reads. Runs LAST, over the freshly-collected data. Reads
      # only from Supabase — no ScrapeCreators credits needed.
      - name: Precompute rankings cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx pipeline/precompute-rankings.ts

      # Creator leaderboard aggregates. MUST run after precompute-rankings: it
      # sources per-product revenue from the rankings_cache payloads that step
      # writes, so running it first would attribute GMV from yesterday's numbers.
      # Supabase-only — no ScrapeCreators credits. Measured ~3.5 min on prod
      # (~205s to load 196k video rows + 45k products, then ~1s per niche/window).
      # Exits non-zero if migrations/manual/2026-07-28-creators.sql has not been
      # applied, rather than writing a partial leaderboard.
      - name: Precompute creator leaderboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx pipeline/precompute-creators.ts
