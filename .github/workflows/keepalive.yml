name: Keep scheduled workflows alive

# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. A run of the schedule does not count as
# activity, which is how daily-refresh.yml and prod-smoke.yml were switched
# off while the site kept serving August data.
#
# Calling the enable endpoint updates the workflow. Doing it weekly, from a
# workflow that also enables itself, keeps the 60-day timer from firing.
# It does not push a commit.
#
# This cannot wake a workflow that is already disabled: a disabled schedule
# does not run, including this one. After a disable, enable all three in the
# Actions tab (or `gh workflow enable <file>`), then this job keeps them on.

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays, 12:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          for wf in daily-refresh.yml prod-smoke.yml keepalive.yml; do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}" --jq '.state')
            echo "${wf}: ${state}"
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable" >/dev/null
            echo "enabled ${wf}"
          done
