name: Daily TikBase Refresh

on:
  schedule:
    - cron: "0 6 * * *" # 6:00 AM UTC daily
  workflow_dispatch: # Allow manual trigger

jobs:
  # SPLIT INTO TWO JOBS, and the reason is arithmetic rather than taste.
  #
  # The 2026-08-15 scheduled run was CANCELLED at exactly 240.3 minutes, mid-way
  # through "Precompute creator leaderboard" — it hit this timeout. Step timings
  # from the last run that finished (2026-08-14, 206.6 min total):
  #
  #   pipeline, phases 1-5        52.7 min
  #   discover videos             32.4 min
  #   precompute rankings        104.3 min
  #   precompute creators         16.8 min
  #
  # 85 minutes of ingestion and 121 of precompute, sharing one 240-minute
  # budget: 33 minutes of headroom, 16%. A catch-up night — more rotation
  # backlog, more products to snapshot — spends that and the precompute is
  # killed after the credits have already been paid for.
  #
  # Two jobs give each side its own 240: ingestion has 2.8x headroom, precompute
  # 2.0x. Nothing is passed between them but the database, so `needs` is the
  # whole handoff. GitHub bills minutes used, so this costs the same.
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # Phase 3 snapshot budget, stated explicitly so the daily ScrapeCreators
      # spend is visible here rather than buried in a default. HOT re-snapshots
      # the top sellers every run; ROTATION drains the least-recently-snapshotted
      # tail so every product is covered on a ~7.5-day cycle — inside the 4.7-10.5
      # day span band that MAX_SPAN_RATIO=1.5 allows for the tightest (7d) window,
      # so a product seen once per cycle can still earn a real delta.
      #
      # TOTAL 6,000 snapshot calls/day (~6,900 including phases 1/2/4/5), up from
      # 3,000. Products served from rankings_cache are monitored, not fetched
      # daily — the end-of-run membership monitor reports their snapshot ages and
      # shouts if any passes 10.5 days. If that fires persistently, the first dial
      # is per-niche hot coverage, then SNAPSHOT_ROTATION_LIMIT.
      #
      # Credits ran out entirely on 2026-07-19/20; the run now exits non-zero on
      # any 402, so a repeat shows red instead of green.
      - name: Run daily refresh pipeline
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SNAPSHOT_HOT_LIMIT: "1500"
          SNAPSHOT_ROTATION_LIMIT: "4500"
        run: node pipeline/tikbase-daily-refresh.js

      # Deepen video coverage for under-covered ranked products. Capped at 150/day
      # to fit the job budget; it progressively clears the backlog since covered
      # products are skipped on subsequent runs.
      - name: Discover videos for top products
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCOVER_LIMIT: "150"
        run: node pipeline/discover-videos.js

  # Precompute runs only if ingestion succeeded — ranking yesterday's data over
  # a half-written snapshot set would be worse than ranking it late.
  precompute:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # Precompute Top Products/Videos rankings into rankings_cache so the API
      # serves instant reads. Runs LAST, over the freshly-collected data. Reads
      # only from Supabase — no ScrapeCreators credits needed.
      - name: Precompute rankings cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx pipeline/precompute-rankings.ts

      # Creator leaderboard aggregates. MUST run after precompute-rankings: it
      # sources per-product revenue from the rankings_cache payloads that step
      # writes, so running it first would attribute GMV from yesterday's numbers.
      # Supabase-only — no ScrapeCreators credits. Measured ~3.5 min on prod
      # (~205s to load 196k video rows + 45k products, then ~1s per niche/window).
      # Exits non-zero if migrations/manual/2026-07-28-creators.sql has not been
      # applied, rather than writing a partial leaderboard.
      - name: Precompute creator leaderboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx pipeline/precompute-creators.ts
